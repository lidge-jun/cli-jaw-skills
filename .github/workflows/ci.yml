name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cli-jaw-skills-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install pytest
      - name: Run focused tests
        run: python3 -m pytest tests/test_dev_frontend_refresh.py -q
      - name: Validate public surface
        run: python3 scripts/validate_public_surface.py
      - name: Check docs assets and metadata
        run: |
          grep -qP "\d+ inspectable skills" docs/index.html
          grep -q "rel=\"canonical\"" docs/index.html
          grep -q "property=\"og:image\"" docs/index.html
          grep -q "name=\"twitter:card\"" docs/index.html
          test -f docs/assets/favicon.svg
          test -f docs/assets/social-preview.svg
      - name: Whitespace check
        run: git diff --check
